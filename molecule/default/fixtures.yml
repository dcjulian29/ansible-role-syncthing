---
# Deliberately listed out of order: the template must sort both folders and
# devices exactly as Syncthing does, or Syncthing rewrites the file.
#
# The peer IDs are real (generated by syncthing generate, keys discarded) -
# Syncthing validates the check characters in an ID. They cover both ends of
# base32 order: A... and Z... among the letters, 3... and 7... after them. The
# container's own ID is generated in prepare, so it lands somewhere different
# in that order on every run.
syncthing_name: molecule

molecule_peer_a: AEWKFUY-OLWAT5Q-NWQWJ3F-XN53HNX-JN3DI4D-2IAYVXB-2URSFW5-BFEMIAN
molecule_peer_z: ZL7Q7YN-SD3ZA2C-U36AYU3-CNVZQPW-XS6QBBY-DRXEGV7-TRU6D2Q-EISTWA4
molecule_peer_3: 3YKUYHM-ABUX7PA-M4OZPVX-V4OXW7D-SO57DSZ-EHXECS5-BCH3DEF-GVW6JQ7
molecule_peer_7: 7BGZNXF-JFVI3MY-NZHRTJF-73AKCF7-PUXSCUD-BTAC7WS-ZUPNZF5-AOWERAT

syncthing_devices:
  - id: "{{ molecule_peer_7 }}"
    name: peer-7
  - id: "{{ molecule_peer_z }}"
    name: peer-z
  - id: "{{ molecule_peer_a }}"
    name: peer-a
  - id: "{{ molecule_peer_3 }}"
    name: peer-3

# Folder IDs sort byte-wise in Syncthing, so "Docs" (uppercase) comes before
# "alpha" and "1-photos" before both.
syncthing_folders:
  - id: alpha
    label: alpha
    path: /var/syncthing/data/alpha
    devices:
      - id: "{{ molecule_peer_z }}"
      - id: "{{ syncthing_device_id }}"
      - id: "{{ molecule_peer_a }}"
  - id: Docs
    label: docs
    path: /var/syncthing/data/docs
    type: sendreceive
    rescan_seconds: 60
    file_watcher: false
    devices:
      - id: "{{ molecule_peer_7 }}"
      - id: "{{ syncthing_device_id }}"
      - id: "{{ molecule_peer_3 }}"
  - id: 1-photos
    label: photos
    path: /var/syncthing/data/photos
    type: receiveonly
    ignore_perms: true
    file_watcher: false
    version_strategy: simple
    version_keep: 5
    devices:
      - id: "{{ syncthing_device_id }}"
      - id: "{{ molecule_peer_a }}"
